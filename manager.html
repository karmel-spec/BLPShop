<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Manager — Brigham Larson Pianos</title>
<style>
  :root{
    --ink:#1c1c1c; --paper:#ffffff; --red:#B43333; --red-deep:#9E2020;
    --line:#e6e1d9; --line-soft:#f0ece5; --mut:#6f6a63; --mut2:#8a847b;
    --good:#2e7d4f; --good-bg:#e7f2ea; --warn:#c9a13a; --warn-bg:#fdf6e3;
    --bad-bg:#f9e9e9; --side:#101013; --side2:#17171b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#f7f5f1;color:var(--ink);font-family:Assistant,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font:inherit;cursor:pointer}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- shell ---------- */
  .shell{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
  /* ?embed=1 — framed inside the Store Map dashboards: no sidebar/chrome,
     the host app provides the navigation */
  html.embed .shell{grid-template-columns:1fr!important}
  html.embed .mbar,html.embed #sideNav,html.embed .mscrim{display:none!important}
  html.embed main{padding:14px 16px 44px;max-width:none}
  .mbar{display:none}
  .mscrim{display:none}
  @media(max-width:900px){
    div.shell{grid-template-columns:1fr}
    .mbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:70;background:var(--side2,#17171b);padding:9px 14px;gap:12px;border-bottom:1px solid #26262c}
    .mbar img{height:30px;width:auto;display:block}
    .mbar button{background:none;border:1px solid #3a3a42;color:#fff;font-size:20px;line-height:1;border-radius:8px;padding:6px 12px;cursor:pointer}
    .mscrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .18s}
    .mscrim.on{opacity:1;pointer-events:auto}
    aside.side{position:fixed;top:0;left:0;z-index:90;height:100vh;width:min(78vw,300px);transform:translateX(-100%);transition:transform .2s ease;box-shadow:2px 0 24px rgba(0,0,0,.35)}
    aside.side.open{transform:translateX(0)}
    aside.side nav{overflow-y:auto;flex:1}
  }
  .side{background:linear-gradient(180deg,var(--side2),var(--side));color:#c9c3ba;display:flex;flex-direction:column;padding:16px 0;position:sticky;top:0;height:100vh}
  .badge{align-self:center;padding:0 16px}
  .badge img{width:100%;max-width:170px;display:block;height:auto}
  .side nav{display:flex;flex-direction:column;font-size:14px}
  .side nav button{background:none;border:0;color:#a49d90;text-align:left;padding:10px 20px;display:flex;gap:9px;align-items:center;border-left:3px solid transparent}
  .side nav button.on{color:#fff;background:rgba(180,51,51,.14);border-left-color:var(--red);font-weight:600}
  .side .lang{margin:10px 20px 0;display:flex;border:1px solid #34343c;border-radius:99px;overflow:hidden;align-self:flex-start}
  .side .lang button{background:none;border:0;color:#a49d90;padding:5px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em}
  .side .lang button.on{background:var(--red);color:#fff}
  .side .who{margin-top:auto;padding:12px 20px;border-top:1px solid #26262c;font-size:12px;color:#a49d90;line-height:1.5}
  .side .who b{color:#fff}
  .side .who a{color:#c9c3ba;text-decoration:underline;text-underline-offset:2px}

  main{padding:24px 26px 70px;max-width:1220px}
  h2.page{font-family:Georgia,serif;font-size:24px;margin:0;font-weight:700}
  .sub{color:var(--mut);font-size:13.5px;margin-top:3px;max-width:76ch;line-height:1.5}
  .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .btn{background:var(--red);color:#fff;border:0;border-radius:5px;padding:9px 16px;font-weight:700;font-size:13.5px}
  .btn:hover{background:var(--red-deep)}
  .btn2{background:#fff;color:var(--ink);border:1px solid var(--ink);border-radius:5px;padding:8px 14px;font-weight:700;font-size:13px}
  .btn3{background:none;border:1px solid var(--line);border-radius:5px;padding:6px 12px;font-size:12.5px;color:#57524b}
  .pill{display:inline-block;border-radius:99px;font-size:11px;font-weight:700;padding:2px 9px;white-space:nowrap}
  .pill.ok{background:var(--good-bg);color:var(--good)} .pill.miss{background:var(--bad-bg);color:var(--red-deep)}
  .pill.wait{background:var(--warn-bg);color:#8a6d1a} .pill.lvl{background:#eee9e0;color:#57524b}
  .card{background:#fff;border:1px solid var(--line);border-radius:7px}
  /* training list */
  .trainlist{display:flex;flex-direction:column;gap:12px;max-width:860px}
  .trainrow{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:15px 18px;color:inherit}
  .trainrow:hover{border-color:var(--red);box-shadow:0 1px 6px rgba(0,0,0,.06)}
  .trainrow .tr-main{flex:1;min-width:0}
  .trainrow h3{margin:0 0 3px;font-family:Georgia,serif;font-size:16.5px;font-weight:700}
  .trainrow .tr-desc{color:var(--mut);font-size:13px;line-height:1.5}
  .trainrow .tr-acts{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .trainrow .tr-acts a{white-space:nowrap;font-weight:700;font-size:13px;color:var(--red);text-decoration:none}
  .trainrow .tr-acts a:hover{text-decoration:underline}
  .banner{background:var(--red);color:#fff;border-radius:7px;padding:10px 16px;font-size:14px;margin-bottom:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .banner b{font-weight:700}
  .view{display:none}.view.on{display:block}

  /* ---------- gate ---------- */
  #gate{min-height:100vh;display:grid;place-items:center;background:var(--side)}
  #gate .card{max-width:400px;width:92%;text-align:center;padding:34px 30px;border:none}
  #gate img{max-width:220px}
  #gate .rule{display:flex;align-items:center;margin:18px 0}
  #gate .rule i{flex:1;height:2px;background:var(--red-deep)}
  #gate .rule s{width:7px;height:7px;border-radius:50%;background:var(--red-deep);margin:0 5px}
  #gate h1{font-size:13px;letter-spacing:.24em;margin:0 0 14px;color:#4a4a4a;font-weight:600}
  #gate .msg{color:var(--mut);font-size:13.5px;line-height:1.55;margin-top:14px}

  /* ---------- weekly review ---------- */
  .rev-row{display:grid;grid-template-columns:1fr auto auto auto auto;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line-soft);cursor:pointer}
  .rev-row:hover{background:#fbfaf7}
  .rev-row:last-child{border-bottom:0}
  .rev-row .tech{font-weight:700;font-size:14.5px}
  .ck{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mut2)}
  .ck .dot{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:1.5px solid var(--line);color:transparent}
  .ck.yes .dot{background:var(--good);border-color:var(--good);color:#fff}
  .ck.no .dot{background:var(--bad-bg);border-color:var(--red-deep)}
  .revpanel{border-top:2px solid var(--ink);background:#fbfaf7;padding:16px;display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
  @media(max-width:900px){.revpanel{grid-template-columns:1fr}}
  .revpanel h5{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#57524b}
  .revpanel .reptext{font-size:13.5px;line-height:1.55;white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px;max-height:300px;overflow-y:auto}
  .revpanel .item{background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:13px;margin-bottom:7px;line-height:1.45}
  .revpanel .item .src{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);font-weight:700}
  .rev-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

  /* ---------- curtis work orders ---------- */
  .curwrap{border:1px solid var(--line);border-radius:6px;background:#fff;overflow:auto;max-height:calc(100vh - 240px)}
  .curgrid{border-collapse:collapse;font-size:12.5px;min-width:1180px;width:100%}
  .curgrid th{position:sticky;top:0;background:#f2efe8;border-bottom:2px solid var(--line);padding:8px 9px;text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#57524b;white-space:nowrap;z-index:2}
  .curgrid td{border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);padding:6px 9px;vertical-align:top;min-width:64px;max-width:260px;line-height:1.4}
  .curgrid td[contenteditable]{cursor:text}
  .curgrid td[contenteditable]:hover{background:#faf8f4}
  .curgrid td[contenteditable]:focus{outline:2px solid var(--red);background:#fff}
  .curgrid td.saving{background:#fdf6e6}
  .curgrid td.saved{background:#e7f2ea;transition:background 1.2s}
  .curgrid td.savefail{background:#f9e9e9;outline:1.5px solid var(--red)}
  .curgrid td.divrow{background:#efece5;font-weight:700;color:#57524b}
  .curgrid td .ck{cursor:pointer;font-size:15px;user-select:none}
  .curmsg{font-size:12.5px;color:var(--mut);margin:8px 2px;min-height:15px}
  .curmsg.err{color:var(--red);font-weight:700}

  /* ---------- BLP Apps dropdown (sidebar) ---------- */
  .apps-menu{margin-top:10px;border-top:1px solid rgba(255,255,255,.12);padding-top:8px}
  .apps-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:none;color:rgba(243,239,233,.78);font:inherit;font-size:14px;padding:9px 12px;border-radius:8px;cursor:pointer}
  .apps-toggle:hover{background:rgba(255,255,255,.08);color:#fff}
  .apps-link{display:block;padding:7px 12px 7px 26px;border-radius:8px;color:rgba(243,239,233,.66);font-size:13.5px;text-decoration:none}
  .apps-link:hover{background:rgba(255,255,255,.08);color:#fff}
  /* ---------- whiteboard ---------- */
  .wbgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px;align-items:start}
  @media (max-width:900px){.wbgrid{grid-template-columns:1fr}}
  .wbcol{background:#fff;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
  .wbcol>h3{margin:0;padding:13px 16px 9px;font-family:Georgia,serif;font-size:17px;letter-spacing:.16em;text-transform:uppercase;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline}
  .wbcol>h3 small{font-size:11px;letter-spacing:.03em;text-transform:none;color:var(--mut2)}
  .wbitem{padding:10px 14px;border-bottom:1px solid var(--line-soft);display:flex;gap:10px;align-items:flex-start}
  .wbitem.done .wtxt{color:var(--mut2);text-decoration:line-through}
  .wbitem .wnote{display:block;font-size:11.5px;color:var(--red-deep);font-weight:600}
  .wbitem .wmeta{display:block;font-size:10.5px;color:var(--mut2)}
  .wbadd{display:flex;gap:7px;padding:10px 12px;background:#faf8f4;border-bottom:1px solid #e5dfd2}
  .wbadd input{flex:1;border:1px solid #cfc9bf;border-radius:6px;padding:8px 10px;font:inherit;font-size:13px;min-width:0}
  .wbnone{padding:16px 14px;color:var(--mut2);font-size:12.5px;font-style:italic}
  .wbsect{padding:7px 14px;background:#f2efe8;border-top:2px solid var(--line);border-bottom:1px solid var(--line);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#57524b;font-weight:700}
  .tpillw{border:1px solid var(--line);border-radius:99px;background:#fff;padding:3px 10px;font-size:11px;font-weight:700;color:#57524b;cursor:pointer;white-space:nowrap}
  .tpillw.on{background:var(--good-bg);border-color:var(--good);color:var(--good)}
  .wbvendors{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  /* proposed-week schedule (embedded from the weekly Claude proposal) */
  .propwrap{border:1px solid var(--line);border-radius:12px;margin-bottom:22px;overflow:hidden}
  .prophead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#17171b;color:#e8e4dd;padding:12px 16px}
  .prophead h3{font-size:15px;margin:0}
  .prophead .meta{font-size:11.5px;color:#a49d90}
  .prophead .applybtn{margin-left:auto;background:var(--red);border:0;color:#fff;border-radius:8px;padding:9px 18px;font-weight:700;font-size:13px;cursor:pointer}
  .prophead .applybtn[disabled]{background:#3a3a42;cursor:default}
  .propbody{padding:14px 16px;background:#fff}
  .proptech{border:1px solid var(--line-soft);border-radius:9px;margin-bottom:10px;overflow:hidden}
  .proptech h5{background:#f7f5f0;padding:7px 11px;font-size:13px;display:flex;gap:10px;align-items:baseline}
  .proptech h5 small{color:var(--mut);font-weight:400}
  .propgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line-soft)}
  .propday{background:#fff;padding:6px 7px;min-height:60px}
  .propday .dh{font-size:9.5px;letter-spacing:1px;color:var(--mut2);text-transform:uppercase;margin-bottom:4px}
  .propblock{border-left:3px solid #9aa3ac;background:#fafbfc;border-radius:0 5px 5px 0;padding:4px 6px;margin-bottom:4px}
  .propblock .bt{font-size:10px;color:var(--mut);font-weight:700}
  .propblock .bl{font-size:11px;line-height:1.35;color:#222}
  .propblock .bn{font-size:10px;color:#8a6a00;font-style:italic}
  .propboxes{padding:10px 16px 16px}
  .propbn{background:#fdf3ec;border:1px solid #eecfae;border-radius:8px;padding:8px 11px;font-size:12px;color:#6b5030;margin-top:8px}
  .propbn b{display:block;margin-bottom:2px}
  .bnhead{margin-top:20px;padding-top:14px;border-top:2px solid var(--line-soft)}
  .bnhead h4{margin:0;font-size:15px;color:#7a3c10}
  .bnhead .bnsub{font-size:12px;color:var(--mut2);margin-top:3px}
  .bnanswer{display:block;width:100%;box-sizing:border-box;margin-top:7px;border:1px dashed #d8b98e;border-radius:6px;background:#fffdf9;padding:7px 9px;font:12px/1.45 inherit;color:#333;min-height:34px;resize:vertical;outline:none}
  .bnanswer:focus{border-style:solid;border-color:#b98a4e}
  .bnanswer::placeholder{color:#c2ad8e;font-style:italic}
  .bnbar{margin-top:10px;display:flex;justify-content:flex-end}
  .applyout{font-size:12.5px;padding:10px 16px;background:#f2f9f4;border-top:1px solid #bfd8c6;color:#2e5d40}
  .applyout.err{background:#fbeaea;border-color:#e5c9c9;color:#9e2020}
  @media(max-width:900px){.propgrid{grid-template-columns:1fr}}

  /* planner notes-to-Claude column + adjust bar */
  .ptflex{display:flex;gap:0;align-items:stretch}
  .ptmain{flex:1;min-width:0}
  .ptnotes{width:240px;flex:none;border-left:1px solid var(--line-soft);background:#fbfaf7;display:flex;flex-direction:column}
  .ptnotes textarea{flex:1;border:0;background:transparent;padding:9px 11px;font:12px/1.5 inherit;color:#333;resize:none;outline:none;min-height:100px}
  .ptnotes textarea::placeholder{color:#b6afa2;font-style:italic}
  .ptnotes .ntag{font-size:9px;letter-spacing:1.4px;color:#a49d90;text-transform:uppercase;padding:7px 11px 0}
  .adjustbar{display:flex;gap:12px;align-items:flex-start;background:#f7f5f0;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:4px 0 14px}
  .adjustbar textarea{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:12.5px/1.5 inherit;min-height:52px;resize:vertical}
  .adjustbar .abtn{background:var(--red);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
  .adjustbar .abtn[disabled]{background:#b9b2a4;cursor:default}
  .adjustout{border-radius:8px;padding:10px 13px;font-size:12.5px;margin:0 0 14px;display:none}
  .adjustout.ok{display:block;background:#f2f9f4;border:1px solid #bfd8c6;color:#2e5d40}
  .adjustout.err{display:block;background:#fbeaea;border:1px solid #e5c9c9;color:#9e2020}
  .adjustout ul{margin:4px 0 0 18px}
  .adjhist{margin:0 0 14px}
  .ahentry{border:1px solid var(--line);border-radius:8px;margin:0 0 7px;background:#fff}
  .ahentry summary{cursor:pointer;padding:9px 13px;font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;list-style-position:inside}
  .ahbadge{margin-left:auto;font-size:11px;border-radius:20px;padding:2px 9px;white-space:nowrap}
  .ahbadge.ok{background:#e7f2ea;color:#2e5d40}
  .ahbadge.bad{background:#fbeaea;color:#9e2020}
  .ahsec{padding:0 13px 9px;font-size:12.5px}
  .ahsec pre{white-space:pre-wrap;font:inherit;margin:3px 0 0;color:var(--mut2);background:#faf9f7;border-radius:6px;padding:7px 10px;overflow-x:auto}
  .ahsec.qq pre{color:#8a6a00}
  @media(max-width:1000px){.ptflex{flex-direction:column}.ptnotes{width:auto;border-left:0;border-top:1px solid var(--line-soft)}}

  /* ---------- dashboard + planner (moved from the tech app) ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:18px}
  .stat{border:1px solid var(--line);border-radius:6px;padding:14px 16px;background:#fff}
  .stat .k{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);font-weight:700}
  .stat .v{font-family:Georgia,serif;font-size:28px;margin-top:5px;font-weight:700}
  .stat .v small{font-size:16px;color:var(--mut2)}
  .stat .d{font-size:12.5px;margin-top:4px;color:var(--mut)}
  .stat .d.good{color:var(--good)} .stat .d.warn{color:var(--red)}
  .cols{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;margin-top:18px}
  #view-dash .card>h4{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#57524b;display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:10px}
  #view-dash .card>h4 .lite{font-weight:400;letter-spacing:0;text-transform:none;color:var(--mut2);font-size:12px}
  #view-dash table.list{width:100%;border-collapse:collapse;font-size:13.5px}
  #view-dash table.list td{padding:10px 16px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.5}
  #view-dash table.list tr:last-child td{border-bottom:0}
  .pill.in{background:var(--good-bg);color:var(--good)} .pill.out{background:var(--bad-bg);color:var(--red-deep)} .pill.mid{background:var(--warn-bg);color:#8a6d1d}
  .excerpt{color:#3d3a35}
  .tech-name{font-weight:700;white-space:nowrap}
  .date-cell{color:var(--mut2);font-size:12px;white-space:nowrap;font-family:ui-monospace,Menlo,monospace}
  .brow{display:grid;grid-template-columns:84px 1fr 44px;align-items:center;gap:10px;font-size:12.5px;padding:4px 16px}
  .btrack{background:var(--line-soft);border-radius:3px;height:12px;position:relative}
  .bfill{position:absolute;inset:0 auto 0 0;background:#191919;border-radius:3px}
  .bfill.hot{background:var(--red)}
  .brow b{text-align:right}
  .notice{margin-top:14px;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:6px;padding:12px 15px;font-size:13.5px;color:#57524b;line-height:1.55;background:#fffdf7}
  .notice.ok{border-left-color:var(--good);background:#f7fbf8}
  .tcard{border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:14px;overflow:hidden}
  .tcard h4{margin:0;padding:11px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:10px}
  .tcard h4 .st{font-size:11.5px}
  .tcard ul{margin:0;padding:8px 16px 12px 32px;font-size:13.5px;line-height:1.7;color:#3d3a35}
  .tcard .none{padding:10px 16px;color:var(--mut2);font-size:13px}
  /* ---------- walk-around ---------- */
  .cats{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
  .cat{border:1px solid var(--line);border-radius:99px;background:#fff;padding:8px 15px;font-size:13.5px;color:#57524b}
  .cat.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
  .wa-form{display:flex;flex-direction:column;gap:10px;padding:16px}
  .wa-form input,.wa-form textarea{border:1px solid #cfc9bf;border-radius:6px;padding:11px 13px;font:inherit;font-size:15px}
  .wa-form textarea{min-height:84px;resize:vertical}
  .wa-form input:focus,.wa-form textarea:focus{outline:2px solid var(--red);border-color:var(--red)}
  .suggest{position:relative}
  .suggest .list{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:0 0 6px 6px;z-index:20;max-height:210px;overflow-y:auto;box-shadow:0 10px 24px rgba(0,0,0,.12)}

const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function parseCSV(text){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else{ if(c==='"')q=true; else if(c===","){row.push(cur);cur="";} else if(c==="\n"){row.push(cur);rows.push(row);row=[];cur="";} else if(c!=="\r")cur+=c; } }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows;
}
async function gviz(sheetId, gidOrName){
  const sel = /^\d+$/.test(String(gidOrName)) ? `gid=${gidOrName}` : `sheet=${encodeURIComponent(gidOrName)}`;
  const r = await fetch(`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&headers=0&${sel}`);
  return parseCSV(await r.text());
}
function thisFriday(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()+((5-x.getDay()+7)%7));return x;}

function reportFriday(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+2)%7));return x;}
const iso = d => d.toISOString().slice(0,10);
function fmtShort(s){ if(!s)return "—"; const [y,m,d]=String(s).split("-"); return `${+m}/${+d}/${String(y).slice(2)}`; }
function mondayOf(f){const m=new Date(f);m.setDate(m.getDate()-4);return m;}

let REPORTS={entries:[]}, SEQ=[], NOTES=[], REFINISH=[], PLOG=[], ROSTER=[];
let PIANOS=new Map();   // serialKey -> {serial, label, spot, level, progress, lastDate, techs:Set}
const SERIAL_DATES=new Map();  // any serial token -> latest report date (brand-independent)
const YEAR = new Date().getFullYear();

async function boot(){
  renderShell();
  document.querySelectorAll(".view").forEach(v=>v.innerHTML=`<div style="color:var(--mut);padding:30px 0">${t("loading")}</div>`);
  const [hist, seq, notes, refin, plog] = await Promise.all([
    fetch("data/report-history.json").then(r=>r.json()).catch(()=>({entries:[],tabs:{}})),
    gviz(CONFIG.SCHED_SHEET, CONFIG.SEQ_GID).catch(()=>[]),
    gviz(CONFIG.SCHED_SHEET, CONFIG.NOTES_GID).catch(()=>[]),
    gviz(CONFIG.REFINISH_SHEET, "0").catch(()=>[]),
    gviz(CONFIG.PIANOLOG_SHEET, "Piano Log").catch(()=>[]),
  ]);
  REPORTS = hist; SEQ = seq; NOTES = notes; REFINISH = refin; PLOG = plog;
  // live refresh of current-year reports
  try{
    const gid = Object.keys(hist.tabs||{}).find(g=>hist.tabs[g].year===YEAR);
    if(gid){
      const rows = await gviz(CONFIG.REPORT_SHEET, gid);
      const dates = rows[0].slice(1);
      const fresh=[];
      rows.slice(1).forEach(r=>{ const tech=(r[0]||"").trim(); if(!tech)return;
        r.slice(1).forEach((cell,i)=>{ cell=(cell||"").trim(); if(!cell||/^n\/?a$/i.test(cell))return;
          const m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec((dates[i]||"").trim());
          const isoD = m?`${m[3].length===2?"20"+m[3]:m[3]}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`:null;
          fresh.push({tech,date:isoD,year:YEAR,text:cell}); });
      });
      if(fresh.length) REPORTS.entries = REPORTS.entries.filter(e=>e.year!==YEAR).concat(fresh);
    }
  }catch(e){}
  await fetchRosterOverrides();
  buildRoster(); buildPianoIndex();
  renderAll();
}

const validTechName = n => /^[A-Za-z][A-Za-z'’.-]+( [A-Za-z'’.-]+)?$/.test(n) && n.length<=22 && !/complete/i.test(n);
function seqRows(){ return SEQ.filter(r=>validTechName((r[1]||"").trim()) && r.slice(2).some(c=>(c||"").trim())); }
let ROSTER_OVR=null;   // {name -> 'active'|'inactive'} from the Roster tab via the bridge
async function fetchRosterOverrides(){
  try{
    // served by the Store Map bridge (the Shop Reports Bridge deployment is
    // owner-locked); same "Roster" tab either way
    const r=await fetch(CONFIG.STOREMAP_BRIDGE+"?fn=shoproster",{redirect:"follow"});
    const out=await r.json();
    if(out.ok && Array.isArray(out.roster)){
      ROSTER_OVR={};
      out.roster.forEach(x=>{ ROSTER_OVR[x.name.toLowerCase()]=x.status; });
      return true;
    }
  }catch(e){}
  ROSTER_OVR=ROSTER_OVR||{};
  return false;
}
function buildRoster(){
  // Weekly Review covers the ACTIVE Friday-report roster (same rule as the
  // shop app), plus Roster-tab additions, minus Roster-tab deactivations.
  const cutoff=new Date(thisFriday()); cutoff.setDate(cutoff.getDate()-8*7);
  const active=new Set(REPORTS.entries.filter(e=>e.date&&e.date>=iso(cutoff)).map(e=>e.tech));
  REPORTS.entries.filter(e=>e.year===YEAR).forEach(e=>active.add(e.tech));
  const ovr=ROSTER_OVR||{};
  Object.entries(ovr).forEach(([lc,status])=>{
    if(status!=="active") return;
    if(![...active].some(n=>n.toLowerCase()===lc)){
      const orig=(REPORTS.entries.find(e=>e.tech.toLowerCase()===lc)||{}).tech;
      active.add(orig || lc.replace(/(^|\s)\w/g,c=>c.toUpperCase()));
    }
  });
  ROSTER=[...active].filter(n=>ovr[n.toLowerCase()]!=="inactive").sort();
}
function seqRowFor(tech){
  const f=tech.split(/\s+/)[0].toLowerCase();
  return seqRows().find(r=>(r[1]||"").trim().split(/\s+/)[0].toLowerCase()===f);
}

const BRANDS=["Steinway","Yamaha","Kawai","Baldwin","Knabe","Chickering","Mason & Hamlin","Wurlitzer","Kimball","Cable-Nelson","Cable Nelson","Weber","Bosendorfer","Bösendorfer","Everett","Sohmer","Petrof","Samick","Young Chang","Schimmel","Bechstein","Heintzman","Hailun","Kohler & Campbell","Gulbransen","Hamilton","Acrosonic","Ivers & Pond","Lester","Winter","Emerson","Vose","Steck","Brambach","Pearl River","Ritmuller","Essex","Boston","Fazioli","Seiler","Ludwig","Ellington","Kranich & Bach","Kranich Bach","Decker","Hallet Davis","Universal","Promberger","Geyer","Mathushek","Sherman Clay","Wing","Walworth","Kreiter","Rudolf","Waterlox","Whitney","Wellington","Story & Clark"];
const BRAND_RE = new RegExp("\\b("+BRANDS.map(b=>b.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b[ #:]*([0-9]{4,8})?","gi");
const skey = s => String(s||"").replace(/\D/g,"");

function notePiano(brand, serial, extra){
  if(!serial) return null;
  const k=skey(serial); if(k.length<4) return null;
  const rec = PIANOS.get(k) || {serial:serial, brand:brand||"", label:(brand?brand+" ":"")+serial, spot:"", level:"", progress:null, lastDate:null, techs:new Set(), request:""};
  if(brand && !rec.brand){ rec.brand=brand; rec.label=brand+" "+serial; }
  Object.assign(rec, extra||{});
  PIANOS.set(k, rec);
  return rec;
}

function buildPianoIndex(){
  // refinishing sheet: priority order, level, request, location
  let pri=0;
  REFINISH.forEach(r=>{
    const brand=(r[1]||"").trim(), serial=(r[2]||"").trim(), loc=(r[3]||"").trim(), lvl=(r[4]||"").trim(), req=(r[5]||"").trim();
    if(!brand||!serial||/^brand$/i.test(brand)) return;
    pri++;
    notePiano(brand, serial, {spot:loc, level:lvl, request:req, refinishPri:pri});
  });
  // sequence tab: jobs per tech (only active-roster lanes count as "in play")
  const rosterFirsts=new Set(ROSTER.map(n=>n.split(/\s+/)[0].toLowerCase()));
  seqRows().forEach(r=>{
    const tech=(r[1]||"").trim();
    const activeLane=rosterFirsts.has(tech.split(/\s+/)[0].toLowerCase());
    r.slice(2).forEach(job=>{ job=(job||"").trim(); if(!job)return;
      BRAND_RE.lastIndex=0; const m=BRAND_RE.exec(job);
      if(m&&m[2]){ const rec=notePiano(m[1],m[2],activeLane?{inSeq:true}:{}); if(rec) rec.techs.add(tech); }
    });
  });
  // report mentions: latest date + progress %
  const sorted=[...REPORTS.entries].filter(e=>e.date).sort((a,b)=>a.date.localeCompare(b.date));
  SERIAL_DATES.clear();
  sorted.forEach(e=>{ (e.text.match(/\d{4,8}/g)||[]).forEach(tok=>SERIAL_DATES.set(tok, e.date)); });
  sorted.forEach(e=>{
    BRAND_RE.lastIndex=0; let m;
    while((m=BRAND_RE.exec(e.text))){
      if(!m[2]) continue;
      const rec=notePiano(m[1],m[2],{lastDate:e.date}); if(!rec) continue;
      rec.techs.add(e.tech);
      const after=e.text.slice(m.index, m.index+160);
      rec.snip=after;
      const pm=/(\d{1,3})\s?%/.exec(after);
      if(pm && +pm[1]<=100) rec.progress=+pm[1];
    }
  });
}

function connectCalendar(cb){
  const s=document.createElement("script"); s.src="https://accounts.google.com/gsi/client"; s.async=true;
  s.onload=()=>{
    const tc=google.accounts.oauth2.initTokenClient({
      client_id:CONFIG.GOOGLE_CLIENT_ID,
      scope:"https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/calendar.events",
      callback:async(resp)=>{ calToken=resp.access_token; await mapCalendars(); renderAll(); if(cb)cb(); }
    });
    tc.requestAccessToken();
  };
  document.head.appendChild(s);
}
async function gcal(path, opts){
  const r=await fetch("https://www.googleapis.com/calendar/v3/"+path,{...(opts||{}),headers:{Authorization:"Bearer "+calToken,"Content-Type":"application/json",...((opts||{}).headers||{})}});
  return r.json();
}
async function mapCalendars(){
  const out=await gcal("users/me/calendarList?maxResults=250");
  CAL_MAP={};
  (out.items||[]).forEach(c=>{
    const s=(c.summary||"").toLowerCase();
    ROSTER.forEach(tech=>{ if(s.includes(tech.toLowerCase()) && !CAL_MAP[tech]) CAL_MAP[tech]=c.id; });
  });
}
async function eventsFor(tech, from, to){
  if(!CAL_MAP[tech]) return [];
  const out=await gcal(`calendars/${encodeURIComponent(CAL_MAP[tech])}/events?singleEvents=true&orderBy=startTime&timeMin=${from.toISOString()}&timeMax=${to.toISOString()}&maxResults=100`);
  return (out.items||[]).filter(e=>e.status!=="cancelled");
}
async function createEvent(tech, summary, dayISO){
  if(!CAL_MAP[tech]) return null;
  return gcal(`calendars/${encodeURIComponent(CAL_MAP[tech])}/events`,{method:"POST",
    body:JSON.stringify({summary, start:{date:dayISO}, end:{date:dayISO}})});
}

async function loadBumps(tech){
  if(BUMP_CACHE[tech]) { renderAll(); return; }
  const mon=mondayOf(FRI), sat=new Date(FRI); sat.setDate(sat.getDate()+1);
  const evs=await eventsFor(tech, mon, sat);
  const rep=weekReports().find(e=>e.tech===tech);

  BUMP_CACHE[tech]=evs.filter(e=>{
    const words=(e.summary||"").toLowerCase().split(/\W+/).filter(w=>w.length>3);
    const mentioned=words.some(w=>reptext.includes(w));
    return !mentioned;  // not mentioned in report -> candidate for bump
  }).map(e=>({summary:e.summary||"(no title)", when:(e.start?.date||e.start?.dateTime||"").slice(0,10), done:false}));

}

function extractPianos(text){
  const found=[]; let m; BRAND_RE.lastIndex=0;
  while((m=BRAND_RE.exec(text))){
    const brand=m[1].replace(/\s+/g," ");
    const serial=m[2]||null;
    found.push({brand,serial,label:serial?`${brand} ${serial}`:brand});
  }
  return found;
}
function sumHours(text){
  let s=0,m; const re=/(\d+(?:\.\d+)?)\s*(?:hrs?\b|hours?\b)/gi;
  while((m=re.exec(text))){ const v=parseFloat(m[1]); if(v>0&&v<200) s+=v; }
  return s;
}

    t.addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); box.querySelector("#bnApply")?.click(); } }));
  // Heavy AI jobs run as Netlify BACKGROUND functions (a schedule revision
  // takes 30-90s, past the sync limit). POST returns 202 instantly; the
  // result lands in a blob keyed by our nonce, which we poll here.
  const aiJob=async(fn,payload,onTick)=>{
    const nonce="adj_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,10);
    // adjust-submit is a sync relay: browsers can't POST straight to Netlify
    // background functions cross-origin (preflight gets an empty 202)
    const r=await fetch("https://blpsalesapp.netlify.app/.netlify/functions/adjust-submit",{
      method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({fn:fn.startsWith("bottleneck")?"bottleneck":"schedule",payload:{...payload,nonce}})});
    if(r.status>=400) throw new Error("request failed ("+r.status+")");
    const t0=Date.now();
    while(Date.now()-t0<210000){
      await new Promise(res=>setTimeout(res,4000));
      if(onTick) onTick(Math.round((Date.now()-t0)/1000));
      const pr=await fetch("https://blpsalesapp.netlify.app/.netlify/functions/adjust-result?nonce="+nonce);

const EXIT_STEPS=[

async function trxSave(card){

  await fetch(CONFIG.ROSTER_API,{method:"POST",headers:curHeaders(true),
    body:curBody({transition:{row:+card.dataset.row,name:card.dataset.name,type:card.dataset.type,
      steps:JSON.stringify(steps)}})});

function trxWire(v,G){
  const load=v.querySelector("#trxLoad");
  if(load) load.onclick=e=>{ e.preventDefault(); trxFetch(); };
  const start=async type=>{
    const who=v.querySelector("#trxWho").value;
    if(!who){ alert("Pick the team member first."); return; }
    await fetch(CONFIG.ROSTER_API,{method:"POST",headers:curHeaders(true),
      body:curBody({transition:{name:who,type,steps:"{}"}})});
    await trxFetch();
  };
  const ex=v.querySelector("#trxExit"); if(ex) ex.onclick=()=>start("exit");
  const ob=v.querySelector("#trxOnb"); if(ob) ob.onclick=()=>start("onboard");
  v.querySelectorAll(".trxcard").forEach(card=>{
    card.querySelectorAll("input[type=checkbox]").forEach(b=>b.onchange=()=>trxSave(card));
    const done=card.querySelector(".trxdone");
    if(done) done.onclick=async()=>{
      if(!confirm("Close this checklist for "+card.dataset.name+"?")) return;
      const steps={};
      card.querySelectorAll("input[type=checkbox]").forEach(b=>{ if(b.checked) steps[b.dataset.i]=1; });
      await fetch(CONFIG.ROSTER_API,{method:"POST",headers:curHeaders(true),
        body:curBody({transition:{row:+card.dataset.row,name:card.dataset.name,type:card.dataset.type,
          steps:JSON.stringify(steps),done:true}})});
      trxFetch();
    };
    const mv=card.querySelector(".trxmove");
    if(mv) mv.onclick=async()=>{
      const name=card.dataset.name;
      const cur=(G.tabs&&G.tabs["Current Team"])||[];
      const ri=cur.slice(1).findIndex(r=>((r[0]+" "+(r[1]||"")).trim().toLowerCase()===name.toLowerCase()));
      if(ri<0){ alert("Couldn't find "+name+" on Current Team — maybe already moved?"); return; }
      if(!confirm("Move "+name+" to the Former BLP tab? Their display info moves there, the complete raw row is archived server-side, and the Current Team row is removed.")) return;
      mv.disabled=true; mv.textContent="Moving…";
      const r=await fetch(CONFIG.ROSTER_API,{method:"POST",headers:curHeaders(true),
        body:curBody({tab:"Current Team",move:{row:ri+2}})});
      const j=await r.json();
      if(j.ok){ mv.textContent="✓ Moved to Former BLP"; gridState("roster").tabs=null; gridFetch("roster"); }
      else{ mv.disabled=false; mv.textContent="✗ "+(j.error||"failed — try again"); }
    };
  });
}

/* ================= APP REQUESTS (suggestion box triage) =================
   Team-filed bugs/edits/ideas from the Store Map's 💡 button. Status flow:
   Requested -> In progress -> Live -> Tested. Flipping to Live texts the
   requester (request-notify on blpsalesapp); "Copy for Claude" packages the
   request for pasting into a Claude Code session. */
let RQ={rows:null,loading:false,f:{type:"",status:"",who:"",q:""}};
// Tested/Resolved = done = closed: they leave the active list the moment
// they're marked, same as Archived (Brigham 9/1). Closed items stay
// reachable through the status dropdown, and a text search digs through
// closed history too. "Texted for info" = open, waiting on the requester.
const rqClosed=x=>x.status==="Tested"||x.status==="Archived"||x.status==="Resolved";
function rqFiltered(){
  const f=RQ.f;
  return (RQ.rows||[]).filter(x=>
    (!f.type||x.type===f.type)&&
    (!f.who||x.who===f.who)&&
    (!f.q||(x.text+" "+x.context+" "+x.id+" "+x.who+" "+x.status).toLowerCase().includes(f.q.toLowerCase()))&&
    (f.status==="all"?true
     :f.status?x.status===f.status
     :(!rqClosed(x)||!!f.q)));
}
function rqPrint(){
  const rows=rqFiltered();
  const day=new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
  const w=window.open("","_blank");
  if(!w){ alert("Pop-up blocked — allow pop-ups to print."); return; }
  const f=RQ.f;
  const scope=[f.type&&("type: "+f.type),f.status&&("status: "+f.status),f.who&&("by: "+f.who),f.q&&('search: "'+f.q+'"')].filter(Boolean).join(" · ")||"all requests";
  w.document.write(`<!doctype html><html><head><title>App Requests</title><style>
    body{font:12px/1.5 Helvetica,Arial,sans-serif;color:#121212;margin:28px}
    .hd{border-bottom:3px solid #0d0d0d;padding-bottom:10px;margin-bottom:14px}

    .sub{font-size:10px;letter-spacing:2px;color:#777;margin-top:3px}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;font-size:9px;letter-spacing:1px;color:#777;border-bottom:2px solid #ccc;padding:4px 8px 4px 0}
    td{border-bottom:1px solid #eee;padding:5px 8px 5px 0;vertical-align:top}
    .st{font-weight:700}
  </style></head><body>
  <div class="hd"><div class="brand">BRIGHAM LARSON PIANOS</div>
  <div class="sub">APP REQUESTS · ${scope.toUpperCase()} · ${rows.length} ENTRIES · ${day.toUpperCase()}</div></div>
  <table><tr><th>ID</th><th>DATE</th><th>WHO</th><th>TYPE</th><th>REQUEST</th><th>STATUS</th></tr>
  ${rows.map(x=>`<tr><td>${esc(x.id)}</td><td style="white-space:nowrap">${esc((x.date||"").slice(0,10))}</td>
    <td>${esc(x.who)}</td><td>${esc(x.type)}</td><td>${esc(x.text)}</td><td class="st">${esc(x.status)}</td></tr>`).join("")}
  </table><script>onload=()=>setTimeout(()=>print(),250)<\/script>
</body></html>`);
  w.document.close();
}
function rqCsv(){
  const q=x=>'"'+String(x??"").replace(/"/g,'""')+'"';
  const body=rqFiltered().map(x=>[x.id,x.date,x.who,x.type,x.text,x.context,x.screenshot,x.status,x.statusBy,x.statusAt].map(q).join(","));
  const blob=new Blob(["ID,Date,Who,Type,Request,Context,Screenshot,Status,Status By,Status At\n"+body.join("\n")],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="blp-app-requests.csv"; a.click();
}
async function rqFetch(){
  RQ.loading=true; renderRequests();
  try{
    const r=await fetch(CONFIG.STOREMAP_BRIDGE+"?fn=requests",{redirect:"follow"});

}
async function rqSetStatus(id,status,btn){
  const row=(RQ.rows||[]).find(x=>x.id===id); if(!row) return;
  if(btn){ btn.disabled=true; btn.textContent="…"; }
  try{
    // Apps Script sometimes answers with an HTML error page, or with the
    // generic service ping without running the action (9/1) — retry through
    // both instead of surfacing "Unexpected token '<'" at Brigham
    let j=null;
    for(let a=0;a<3;a++){
      const r=await fetch(CONFIG.STOREMAP_BRIDGE,{method:"POST",redirect:"follow",
        headers:{"content-type":"text/plain;charset=utf-8"},
        body:JSON.stringify({action:"requeststatus",id,status,pin:localStorage.getItem("blp.appkey")||"pianoman",
          idToken:localStorage.getItem("blpshop.idtok")||sessionStorage.getItem("blpshop.idtok")||"",
          user:{name:localStorage.getItem("blpmgr.name")||"Shop Manager"}})});
      const txt=await r.text();
      try{ j=JSON.parse(txt); }catch(e2){ j=null; }
      if(j&&j.error) break;                      // real rejection — don't retry
      if(j&&j.ok&&j.id) break;                   // really saved (the ping has no id)
      j=null;
      await new Promise(res=>setTimeout(res,1200*(a+1)));
    }
    if(!j) throw new Error("the Google bridge hiccuped — give it a few seconds and try again");
    if(j.error) throw new Error(j.error);
    row.status=status;
    if(status==="Live"){
      fetch("https://blpsalesapp.netlify.app/.netlify/functions/request-notify",{
        method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({key:localStorage.getItem("blp.appkey")||"pianoman",name:row.who,
          message:"BLP Apps: your request \""+row.text.slice(0,80)+"\" is LIVE — go try it! "+
            "Open the Store Map 💡 button and tap \"It works\" to confirm. Thanks for making the apps better!"})
      }).catch(()=>{});
    }
  }catch(e){ alert("✗ "+e.message); }
  renderRequests();
}

        <div class="rqflow">${STAT.map(st=>`<button class="rqst ${x.status===st?"on":""} s${st.replace(/\s/g,"")}"

          ${rqClosed(x)?"":`<button class="rqst rqres" data-id="${esc(x.id)}" data-st="Resolved" title="Handled without a code change (answered, duplicate, already works) — closes the item">✓ Resolved</button>`}
          ${x.status==="Tested"?`<button class="rqst rqarch" data-id="${esc(x.id)}" data-st="Archived" title="Fully done — remove from this list (find it later under the Archived filter)">🗄 Archive</button>`:""}
          ${rqClosed(x)?`<button class="rqst" data-id="${esc(x.id)}" data-st="Requested" title="Bring it back to the open list">↩ Reopen</button>`:""}</div>
        <div class="rqsmsbox" data-id="${esc(x.id)}" hidden>
          <div class="rqpresets">
            <button class="rqpre" data-t="Could you send that screenshot again through the 💡 button? It didn't come through.">📷 resend screenshot</button>
            <button class="rqpre" data-t="Could you give me a bit more detail on what you'd like changed?">➕ more detail</button>
            <button class="rqpre" data-t="Where in the app does this happen? Which page/button?">📍 where exactly?</button>
            <button class="rqpre" data-t="Quick question about this — grab me next time you see me in the shop.">🗣 let's talk</button>
          </div>
          <textarea class="rqsmstxt" rows="2" placeholder="Text ${esc((x.who||"").split(" ")[0])} about this request… (they'll see which request it's about)"></textarea>
          <div class="rqsmsrow">
            <button class="abtn rqsmssend" data-id="${esc(x.id)}">Send text</button>
            <button class="btn2 rqsmscancel">Cancel</button>
            <span class="rqsmsout"></span>
          </div>
        </div>
      </div>`).join(""):`<div class="curmsg">${(f.type||f.status||f.who||f.q)?"Nothing matches these filters.":"No open requests — the box is empty. 🎉"}</div>`}`;
  $("#rqReload")&&($("#rqReload").onclick=rqFetch);
  $("#rqPrint")&&($("#rqPrint").onclick=rqPrint);
  $("#rqCsv")&&($("#rqCsv").onclick=rqCsv);
  $("#rqClear")&&($("#rqClear").onclick=()=>{RQ.f={type:"",status:"",who:"",q:""};renderRequests();});
  v.querySelectorAll(".rqf").forEach(el=>{
    const apply=()=>{RQ.f[el.dataset.f]=el.value;renderRequests();
      const again=v.querySelector(`.rqf[data-f="${el.dataset.f}"]`);
      if(again&&again.tagName==="INPUT"){again.focus();again.setSelectionRange(again.value.length,again.value.length);}};
    if(el.tagName==="SELECT") el.onchange=apply;
    else el.oninput=()=>{clearTimeout(el._t);el._t=setTimeout(apply,350);};
  });
  v.querySelectorAll(".rqst").forEach(b=>b.onclick=()=>{ if(!b.classList.contains("on")) rqSetStatus(b.dataset.id,b.dataset.st,b); });
  v.querySelectorAll(".rqcopy:not(.rqsmsbtn)").forEach(b=>b.onclick=async()=>{
    const x=(RQ.rows||[]).find(r=>r.id===b.dataset.id); if(!x) return;
    const brief=`App request ${x.id} (${x.type}) from ${x.who}, ${x.date.slice(0,10)}:\n"${x.text}"\nContext: ${x.context||"—"}${x.screenshot?"\nScreenshot: "+x.screenshot:""}`;
    await navigator.clipboard.writeText(brief);
    b.textContent="✓ copied"; setTimeout(()=>{b.textContent="📋 Copy for Claude";},1500);
  });
  // 💬 text the submitter — clarify, ask for a re-sent screenshot, anything.
  // Inline compose (prompt() is blocked in embedded browsers); sends through
  // request-notify, which looks up the phone on Tech Phones server-side.
  v.querySelectorAll(".rqsmsbtn").forEach(b=>b.onclick=()=>{
    const box=v.querySelector(`.rqsmsbox[data-id="${b.dataset.id}"]`); if(!box) return;
    box.hidden=!box.hidden;
    if(!box.hidden) box.querySelector(".rqsmstxt").focus();
  });
  v.querySelectorAll(".rqsmsbox").forEach(box=>{
    const x=(RQ.rows||[]).find(r=>r.id===box.dataset.id); if(!x) return;
    const ta=box.querySelector(".rqsmstxt"), out=box.querySelector(".rqsmsout");
    box.querySelectorAll(".rqpre").forEach(p=>p.onclick=()=>{ ta.value=p.dataset.t; ta.focus(); });
    box.querySelector(".rqsmscancel").onclick=()=>{ box.hidden=true; out.textContent=""; };
    box.querySelector(".rqsmssend").onclick=async(ev)=>{
      const msg=ta.value.trim();
      if(!msg){ ta.focus(); return; }
      const btn=ev.currentTarget; btn.disabled=true; btn.textContent="Sending…"; out.textContent="";
      try{
        const r=await fetch("https://blpsalesapp.netlify.app/.netlify/functions/request-notify",{
          method:"POST",headers:{"content-type":"application/json"},
          body:JSON.stringify({key:localStorage.getItem("blp.appkey")||"pianoman",name:x.who,
            message:`BLP Apps — about your ${x.type||"request"} "${x.text.slice(0,60)}": ${msg} — ${localStorage.getItem("blpmgr.name")||"Shop Manager"}`})});
        const j=await r.json();
        if(j.error) throw new Error(j.error);
        if(j.sent===false) throw new Error(j.reason||"not sent");
        out.textContent=`✓ texted ${x.who.split(" ")[0]}`; ta.value="";
        // an open request you just texted about is now waiting on them
        if(!rqClosed(x)&&x.status!=="Live") rqSetStatus(x.id,"Texted for info");
        setTimeout(()=>{ box.hidden=true; out.textContent=""; },2200);
      }catch(e){ out.textContent="✗ "+e.message; }
      btn.disabled=false; btn.textContent="Send text";
    };
  });
}

/* ================= SHOP BOARD (live work clock + job costing) =================
   Live tiles: who is clocked into which piano right now (bridge fn=timeclock,
   one open session per tech enforced server-side). Below: Job Costing pulled
   from fn=timelog — hours per piano, per tech, cost at a settable shop rate. */
let SB={state:null,rows:null,loading:false,timer:null};
function sbElapsed(startIso){
  const s=Math.max(0,Math.floor((Date.now()-new Date(startIso))/1000));
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
  return h+":"+String(m).padStart(2,"0");
}
function sbHours(min){ return (min/60).toFixed(1); }
async function sbFetchState(){
  try{
    const [r,pr]=await Promise.all([
      fetch(CONFIG.STOREMAP_BRIDGE+"?fn=timeclock",{redirect:"follow"}),
      fetch(CONFIG.STOREMAP_BRIDGE+"?fn=payroll",{redirect:"follow"})]);
    const j=await r.json();
    try{ const pj=await pr.json(); if(pj.open) SB.pay=pj; }catch(e2){}
    if(j.open){ SB.state=j; if(ACTIVE==="shopboard") renderShopBoard(); }
  }catch(e){}
}
async function sbFetchLog(days){
  SB.loading=true; renderShopBoard();
  try{
    const r=await fetch(CONFIG.STOREMAP_BRIDGE+"?fn=timelog&days="+days,{redirect:"follow"});
    const j=await r.json();
    SB.rows=j.rows||[];
  }catch(e){ SB.rows=[]; }
  SB.loading=false; renderShopBoard();
}
async function sbFetchWhere(){
  // off / field / partial status per person, so a quiet tile reads "day off"
  // or "field work" instead of a missed punch (Brigham 8/26)
  try{
    const r=await fetch(CONFIG.STOREMAP_BRIDGE+"?fn=whereis",{redirect:"follow"});
    const j=await r.json();
    SB.where=j.who||{};
  }catch(e){ SB.where={}; }
  if(ACTIVE==="shopboard") renderShopBoard();
}
async function sbFetchRates(){
  // per-person LOADED rates from the report sheet's "Pay Rates" tab (first-name
  // keyed, server-side); anyone blank costs at the blended rate input
  try{
    const key=encodeURIComponent(localStorage.getItem("blp.appkey")||"pianoman");
    const r=await fetch("https://blpsalesapp.netlify.app/.netlify/functions/pay-rates?key="+key);
    const j=await r.json();
    SB.rates=j.rates||{};
  }catch(e){ SB.rates={}; }
  if(ACTIVE==="shopboard") renderShopBoard();
}
async function sbFetchRoles(){
  try{
    const r=await fetch(CONFIG.ROSTER_API+curQS(),{headers:curHeaders(false)});
    const j=await r.json();
    const rows=(j.tabs&&j.tabs["Current Team"])||[];
    const roles={};
    const fulls={},seed=[];
    rows.slice(1).forEach(row=>{
      const first=String(row[0]||"").trim().toLowerCase();
      const full=(String(row[0]||"").trim()+" "+String(row[1]||"").trim()).trim().replace(/\s+/g," ");
      const pos=String(row[2]||"");
      const cat=/intern/i.test(pos)?"intern":/refinish/i.test(pos)?"refinisher"
        :/admin/i.test(pos)?"admin":/mover/i.test(pos)?"mover":"tech";
      if(first&&!roles[first]) roles[first]=cat;
      if(full) roles[full.toLowerCase()]=cat;
      if(first&&!fulls[first]) fulls[first]=full;   // "sadie" -> "Sadie Erickson"
      // refinishers, admins and movers show on the board even before their
      // first punch (Brigham 8/25) — techs/interns still come from the report
      // roster, so family members without shop roles stay off the board
      if(cat==="refinisher"||cat==="admin"||cat==="mover") seed.push(full);
    });
    SB.roles=roles; SB.fullnames=fulls; SB.seed=seed;
  }catch(e){ SB.roles={}; }
  if(ACTIVE==="shopboard") renderShopBoard();
}
function renderShopBoard(){
  const v=$("#view-shopboard"); if(!v) return;
  if(ACTIVE==="shopboard"&&!SB.state&&!SB._kick){ SB._kick=true; sbFetchState(); }
  if(ACTIVE==="shopboard"&&!SB.timer) SB.timer=setInterval(()=>{ if(ACTIVE==="shopboard") sbFetchState(); },60000);
  const st=SB.state||{open:[],todayMinutes:{}};
  // ONE tile per person (Brigham 8/25): the report roster uses first names while
  // clock sessions carry full Google names ("Sadie" vs "Sadie Erickson"), which
  // used to render two tiles. Canonicalize by first name; display the Current
  // Team full name when we have it, else the longest name seen.
  const NAME_ALIAS={guadalupe:"lupita"};   // Current Team uses her legal name; she goes by Lupita
  // Brigham's explicit board adjustments (8/25) — on top of the Current Team sheet
  const BOARD_REMOVE=new Set(["louis","brielle","susie"]);
  const BOARD_ADD={"Josh Larson":"mover","JoJo Larson":"mover","Lisa Litton":"admin"};
  const firstOf=n=>{const f=String(n).trim().split(/\s+/)[0].toLowerCase();return NAME_ALIAS[f]||f;};
  const canon={};
  const pay=SB.pay||{open:[]};
  [...ROSTER,...st.open.map(o=>o.tech),...(pay.open||[]).map(o=>o.tech),...Object.keys(st.todayMinutes),...(SB.seed||[]),...Object.keys(BOARD_ADD)].forEach(n=>{
    const k=firstOf(n); if(!k) return;
    const disp=String(n).trim();
    const curr=canon[k];
    // prefer the name they actually go by (first word matches the canonical
    // key), then the fuller of the two
    const goesBy=s=>s.split(/\s+/)[0].toLowerCase()===k;
    if(!curr||(goesBy(disp)&&!goesBy(curr))||(goesBy(disp)===goesBy(curr)&&disp.length>curr.length))
      canon[k]=disp;
  });
  // upgrade bare first names to the Current Team full name; leave names that
  // are already full alone (so "Brigham Jr Larson" never becomes "Brigham Larson")
  for(const k in canon){ const f=SB.fullnames&&SB.fullnames[k];
    if(f&&canon[k].split(/\s+/).length===1) canon[k]=f; }
  BOARD_REMOVE.forEach(k=>delete canon[k]);
  const names=Object.values(canon).sort();
  const openBy={}; st.open.forEach(o=>openBy[firstOf(o.tech)]=o);
  const payBy={}; (pay.open||[]).forEach(o=>payBy[firstOf(o.tech)]=o);
  const todayFor=n=>{ const k=firstOf(n); let m=0;
    for(const t in st.todayMinutes) if(firstOf(t)===k) m+=st.todayMinutes[t]||0;
    return m; };
  const rate=+(localStorage.getItem("blp.rate")||48);
  const days=+(localStorage.getItem("blp.jcdays")||90);
  // role sections (Brigham 8/25): Interns / Technicians / Refinishers,
  // classified from the Current Team sheet's Position column
  if(ACTIVE==="shopboard"&&!SB.roles&&!SB._rolesKick){ SB._rolesKick=true; sbFetchRoles(); }
  if(ACTIVE==="shopboard"&&SB.where==null&&!SB._whereKick){ SB._whereKick=true; sbFetchWhere(); }
  const tileFor=n=>{
    const o=openBy[firstOf(n)];
    const d=payBy[firstOf(n)];
    const today=todayFor(n);
    // not punched in at all — but are they even due in? (Brigham 8/26)
    const w=!o&&!d&&(SB.where||{})[firstOf(n)];
    const away=w?(w.st==="off"?`🏖 ${esc(w.why||"day off")}`
      :w.st==="field"?`🚗 field — ${esc(w.why||"appointment")}${w.until?" · until "+esc(w.until):""}`
      :`🌗 ${esc(w.why||"partial day")}`):"";
    return `<div class="sbtile ${o?"on":d?"onday":w?"away":""}">
      <b>${esc(n)}</b>
      ${o?`<span class="sbwhat">🎹 #${esc(o.serial)} · ${esc(o.phase||"working")}</span>
           <span class="sbtime">⏱ ${sbElapsed(o.start)}</span>
           ${d?"":`<span class="sbnopay">⚠ on a piano, no day punch</span>`}`
        :d?`<span class="sbwhat day">🕔 day clock — no piano</span>
           <span class="sbtime">⏱ ${sbElapsed(d.start)}</span>`
        :w?`<span class="sbwhat awaywhat">${away}</span>`
         :`<span class="sbwhat off">not clocked in</span>`}
      <span class="sbtoday">today ${sbHours(today)} h</span></div>`;
  };
  const addRoles={}; Object.entries(BOARD_ADD).forEach(([n,cat])=>addRoles[firstOf(n)]=cat);
  const roleOf=n=>{ const r=SB.roles||{};
    return addRoles[firstOf(n)]||r[n.trim().toLowerCase()]||r[firstOf(n)]||"tech"; };
  const SECTIONS=[["🔧 Technicians","tech"],["🎨 Refinishers","refinisher"],
    ["🎓 Interns","intern"],["🗂 Admins","admin"],["🚚 Piano Movers","mover"]];
  const tiles=SECTIONS.map(([label,cat])=>{
    const members=names.filter(n=>roleOf(n)===cat);
    if(!members.length) return "";
    return `<h3 class="sbh3 sbsec">${label} <span class="lite">${members.length}</span></h3>
      <div class="sbtiles">${members.map(tileFor).join("")}</div>`;
  }).join("");
  // job costing aggregation — per-tech LOADED rates from the Pay Rates tab
  // when present; the blended $/h input covers anyone unlisted
  if(ACTIVE==="shopboard"&&SB.rates==null&&!SB._ratesKick){ SB._ratesKick=true; sbFetchRates(); }
  const rateFor=t=>((SB.rates||{})[firstOf(t)])||rate;
  const usingRates=Object.keys(SB.rates||{}).length;
  let jc="";
  if(SB.loading) jc=`<div class="curmsg">Loading time log…</div>`;
  else if(SB.rows){
    const now=Date.now();
    const perPiano={},perTech={};
    for(const r of SB.rows){
      const mins=r.minutes||Math.max(0,Math.round((now-new Date(r.start))/60000));
      const pk=r.serial+"|"+(r.piano||"");
      (perPiano[pk]=perPiano[pk]||{serial:r.serial,piano:r.piano,min:0,techs:{},phases:{}});
      perPiano[pk].min+=mins;
      perPiano[pk].techs[r.tech]=(perPiano[pk].techs[r.tech]||0)+mins;
      perPiano[pk].phases[r.phase||"—"]=(perPiano[pk].phases[r.phase||"—"]||0)+mins;
      perTech[r.tech]=(perTech[r.tech]||0)+mins;
    }
    const cost=techMin=>Object.entries(techMin).reduce((s,[t,m])=>s+m/60*rateFor(t),0);
    const q=(SB.find||"").trim().toLowerCase();
    const pianos=Object.values(perPiano)
      .filter(p=>!q||(String(p.serial)+" "+String(p.piano||"")).toLowerCase().includes(q))
      .sort((a,b)=>b.min-a.min);
    const techs=Object.entries(perTech).sort((a,b)=>b[1]-a[1]);
    jc=`<div class="lite" style="font-size:12px;margin:2px 0 8px">${usingRates
        ?`Costs use each person's loaded rate from the <b>Pay Rates</b> tab (${usingRates} entered); the blended $${rate}/h covers anyone unlisted.`
        :`Costs use the blended $${rate}/h for everyone — enter real loaded rates on the report sheet's <b>Pay Rates</b> tab for true payroll cost.`}</div>
      <table class="sbtbl"><thead><tr><th>Piano</th><th>Hours</th><th>Payroll cost</th><th>By phase</th><th>By tech</th></tr></thead><tbody>
      ${pianos.map(p=>`<tr><td><b>${esc(p.piano||p.serial)}</b><br><span class="lite">#${esc(p.serial)}</span></td>
        <td class="num">${sbHours(p.min)}</td>
        <td class="num">$${Math.round(cost(p.techs)).toLocaleString()}</td>
        <td>${Object.entries(p.phases).sort((a,b)=>b[1]-a[1]).map(([k,m])=>esc(k)+" "+sbHours(m)+"h").join(" · ")}</td>
        <td>${Object.entries(p.techs).sort((a,b)=>b[1]-a[1]).map(([k,m])=>esc(k)+" "+sbHours(m)+"h ($"+Math.round(m/60*rateFor(k)).toLocaleString()+")").join(" · ")}</td></tr>`).join("")||
        `<tr><td colspan=5 style="color:var(--mut2)">${q?"No pianos match \""+esc(q)+"\".":"No punches in this window yet — hours appear as soon as techs start clocking in."}</td></tr>`}
      </tbody></table>
      ${techs.length?`<h3 class="sbh3">Hours by technician (${days}d)</h3>
      <table class="sbtbl"><tbody>${techs.map(([n,m])=>`<tr><td>${esc(n)}</td><td class="num">${sbHours(m)} h</td><td class="num">$${Math.round(m/60*rateFor(n)).toLocaleString()}</td></tr>`).join("")}</tbody></table>`:""}`;
  } else jc=`<div class="curmsg">Pick a window and load the log.</div>`;
  v.innerHTML=`
    <div class="row1"><div><h2 class="page">Shop Board</h2>
      <div class="sub">Who's on what right now — and what every piano is costing in tech hours. One piano per tech, enforced.</div></div></div>
    ${tiles||'<div class="curmsg">Loading…</div>'}
    <div class="row1" style="margin-top:26px"><h2 class="page" style="font-size:19px">Job Costing</h2>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input id="sbFind" placeholder="🔍 filter by serial / piano…" value="${esc(SB.find||"")}"
          style="border:1px solid #cfc9bf;border-radius:7px;padding:6px 10px;font:inherit;font-size:12.5px;width:190px">
        <select id="sbDays">${[30,90,180,365].map(d=>`<option value="${d}" ${d===days?"selected":""}>${d} days</option>`).join("")}</select>
        <label style="font-size:12.5px" title="blended fallback: wage + taxes + overhead, used for anyone without a Pay Rates entry">$<input id="sbRate" type="number" value="${rate}" style="width:56px"> /h blended</label>
        <button class="btn2" id="sbLoad">Load</button>
        <button class="btn2" id="sbCsv" ${SB.rows&&SB.rows.length?"":"disabled"}>⬇ CSV</button>
      </div></div>
    ${jc}`;
  const find=$("#sbFind");
  if(find) find.oninput=()=>{ clearTimeout(find._t); find._t=setTimeout(()=>{
    SB.find=find.value; renderShopBoard();
    const again=$("#sbFind");
    if(again){ again.focus(); again.setSelectionRange(again.value.length,again.value.length); }
  },300); };
  const load=$("#sbLoad");
  if(load) load.onclick=()=>{
    localStorage.setItem("blp.jcdays",$("#sbDays").value);
    localStorage.setItem("blp.rate",$("#sbRate").value||"48");
    sbFetchLog(+$("#sbDays").value);
  };
  const csv=$("#sbCsv");
  if(csv&&SB.rows) csv.onclick=()=>{
    const head="Tech,Serial,Piano,Phase,Clock In,Clock Out,Minutes,Source";
    const q=x=>'"'+String(x??"").replace(/"/g,'""')+'"';
    const body=SB.rows.map(r=>[r.tech,r.serial,r.piano,r.phase,r.start,r.end,r.minutes,r.source].map(q).join(","));
    const blob=new Blob([head+"\n"+body.join("\n")],{type:"text/csv"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="blp-time-log.csv"; a.click();
  };
}

/* ================= SHEET GRIDS (Curtis Harper · Schedules) =================
   Editable grids over team Google Sheets, two-way synced through the
   sales-app bridges (service account). One factory, one instance per sheet. */
const GRID_CFGS={
  curtis:{ api:()=>CONFIG.CURTIS_API, sheet:()=>CONFIG.CURTIS_SHEET_URL,
    tabs:["Requested","Completed, paid, received"],
    title:"cur_title", sub:"cur_sub", addLabel:"cur_addrow", dateHeader:/date requested/i },
  schedule:{ api:()=>CONFIG.SCHEDULE_API, sheet:()=>CONFIG.SCHEDULE_SHEET_URL,
    tabs:["Team Schedule"],
    title:"sched_title", sub:"sched_sub", addLabel:"sched_addrow", dateHeader:null },
  roster:{ api:()=>CONFIG.ROSTER_API, sheet:()=>CONFIG.ROSTER_SHEET_URL,
    tabs:["Current Team","Subcontractors/INS","Former BLP"],
    title:"ros_title", sub:"ros_sub", addLabel:"ros_addrow", dateHeader:null,
    topPanel:G=>trxPanelHTML(G), postRender:(v,G)=>trxWire(v,G) },
};
const GRIDS={};
function gridState(id){
  return GRIDS[id]||(GRIDS[id]={tab:GRID_CFGS[id].tabs[0],tabs:null,fetchedAt:null,loading:false,err:null,flashRow:null,needKey:false});
}
function curToken(){
  const tok=localStorage.getItem("blpshop.idtok")||sessionStorage.getItem("blpshop.idtok")||"";
  if(!tok) return "";
  try{
    const p=JSON.parse(atob(tok.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
    if(p.exp && p.exp*1000 < Date.now()+120000) return "";
  }catch(e){ return ""; }
  return tok;
}
const curKey=()=>((localStorage.getItem("blp.appkey")||"").trim());
const curAuthed=()=>{ if(curToken()||curKey()) return true; renewSession(); return false; };
const curQS=extra=>{ const k=curToken()?"":curKey(); return extra?(k?extra+"&key="+encodeURIComponent(k):extra):(k?"?key="+encodeURIComponent(k):""); };
const curBody=o=>{ const k=curToken()?"":curKey(); return JSON.stringify(k?{key:k,...o}:o); };
function curHeaders(json){
  const h=json?{"content-type":"application/json"}:{};
  const tok=curToken(); if(tok) h["authorization"]="Bearer "+tok;
  return h;
}


function authCardHTML(){
  return `<div class="card" style="padding:16px;max-width:520px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px">
    <div style="font-size:13.5px;color:var(--mut)">${t("auth_need")}</div>
    <button class="btn2 passGo" style="align-self:flex-start">Sign in with Google</button></div>`;
}
function wireAuthCard(v,onUnlocked){
  const go=v.querySelector(".passGo");
  if(go) go.onclick=()=>googleLogin(false);
}

async function gridFetch(id){
  const G=gridState(id), cfg=GRID_CFGS[id];
  if(G.loading) return;
  if(!curAuthed()){ G.needKey=true; renderGrid(id); return; }
  G.loading=true; G.err=null; renderGrid(id);
  try{
    const r=await fetch(cfg.api()+curQS(""),{headers:curHeaders(false)});
    const j=await r.json();
    if(r.status===401){ sessionStorage.removeItem("blpshop.idtok"); G.needKey=true; G.err=j.error||""; renewSession(); }
    else if(j.error){ G.err=t("cur_err",j.error); }
    else { G.tabs=j.tabs; G.fetchedAt=j.fetchedAt; G.needKey=false; }
  }catch(e){ G.err=t("cur_err",String(e.message||e)); }
  G.loading=false; renderGrid(id);
}

async function gridSave(id,tab,row,col,value,td){
  const G=gridState(id), cfg=GRID_CFGS[id];
  if(!curAuthed()){ G.needKey=true; renderGrid(id); return; }
  td.classList.remove("saved","savefail"); td.classList.add("saving");
  try{
    const r=await fetch(cfg.api(),{method:"POST",headers:curHeaders(true),
      body:curBody({tab,updates:[{row,col,value}]})});
    const j=await r.json();
    td.classList.remove("saving");
    if(j.ok){
      td.classList.add("saved"); setTimeout(()=>td.classList.remove("saved"),1500);
      const rows=G.tabs[tab]; while(rows.length<row) rows.push([]);
      const rr=rows[row-1]; while(rr.length<col) rr.push(""); rr[col-1]=value;
      gridMsg(id,t("cur_saved"));
    }else{
      td.classList.add("savefail");
      if(r.status===401){ G.needKey=true; renderGrid(id); renewSession(); }
      gridMsg(id,t("cur_savefail",j.error||("HTTP "+r.status)),true);
    }
  }catch(e){ td.classList.remove("saving"); td.classList.add("savefail"); gridMsg(id,t("cur_savefail",String(e.message||e)),true); }
}

async function gridAdd(id){
  const G=gridState(id), cfg=GRID_CFGS[id];
  if(!curAuthed()){ G.needKey=true; renderGrid(id); return; }
  const tab=G.tab, hdr=(G.tabs&&G.tabs[tab]&&G.tabs[tab][0])||[];
  const row=new Array(Math.max(hdr.length,4)).fill("");
  if(cfg.dateHeader){
    const di=hdr.findIndex(h=>cfg.dateHeader.test(h||""));
    if(di>=0) row[di]=new Date().toLocaleDateString("en-US");
  }
  try{
    const r=await fetch(cfg.api(),{method:"POST",headers:curHeaders(true),
      body:curBody({tab,append:row})});
    const j=await r.json();
    if(j.ok){ G.flashRow=j.row||null; G.tabs=null; await gridFetch(id); }
    else{ if(r.status===401){ G.needKey=true; renderGrid(id); renewSession(); } gridMsg(id,t("cur_savefail",j.error||("HTTP "+r.status)),true); }
  }catch(e){ gridMsg(id,t("cur_savefail",String(e.message||e)),true); }
}

function gridMsg(id,txt,err){
  const m=document.querySelector(`#view-${id} .gridmsg`);

function renderGrid(id){

      <tr>${(rows[0]||[]).map(h=>`<th>${esc(h)}</th>`).join("")}</tr>
      ${rows.slice(1).map((r,ri)=>{
        const n=Math.max((rows[0]||[]).length,r.length);
        const nonEmpty=r.filter(x=>(x||"").trim()).length;
        const isDiv=((r[0]||"")+(r[1]||"")).indexOf("---")>=0||(nonEmpty===1&&!(r[0]||"").trim()&&(r[1]||"").trim().length>20);
        return `<tr>${Array.from({length:n},(_,ci)=>{
          const val=(r[ci]||"");
          if(/^(TRUE|FALSE)$/.test(val.trim()))
            return `<td data-r="${ri+2}" data-c="${ci+1}"><span class="ck" data-b="${val.trim()}">${val.trim()==="TRUE"?"☑":"☐"}</span></td>`;
          return `<td ${isDiv?'class="divrow"':""} contenteditable="plaintext-only" data-r="${ri+2}" data-c="${ci+1}">${esc(val)}</td>`;
        }).join("")}</tr>`;
      }).join("")}
    </table></div>`:""}`;
  v.querySelector(".gridRefresh").onclick=()=>{ G.tabs=null; G.err=null; gridFetch(id); };
  v.querySelector(".gridAddBtn").onclick=()=>gridAdd(id);
  if(G.needKey&&!curAuthed()) wireAuthCard(v,()=>{ G.err=null; G.tabs=null; gridFetch(id); });
  v.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{ G.tab=b.dataset.ct; renderGrid(id); });

    td.dataset.orig=td.textContent;
    td.onkeydown=e=>{
      if(e.key==="Enter"){ e.preventDefault(); td.blur(); }
      if(e.key==="Escape"){ td.textContent=td.dataset.orig; td.blur(); }
    };
    td.onblur=()=>{ const val=td.textContent;
      if(val!==td.dataset.orig){ td.dataset.orig=val; gridSave(id,G.tab,+td.dataset.r,+td.dataset.c,val,td); } };
  });
  v.querySelectorAll(".ck").forEach(ck=>ck.onclick=()=>{
    const td=ck.parentElement, nv=ck.dataset.b==="TRUE"?"FALSE":"TRUE";

    gridSave(id,G.tab,+td.dataset.r,+td.dataset.c,nv,td);

  if(cfg.postRender) try{ cfg.postRender(v,G); }catch(e){}

  }
  if(cfg.wireTop&&G.tabs) cfg.wireTop(v,G);

async function brigFetch(){
  if(BRIG.loading) return;

  BRIG.loading=true; BRIG.err=null; renderBrigham();

    const j=await r.json();

async function brigPost(body,after){

/* ================= WEEK BOARD ================= */
function currentWeekColumn(){
  if(!NOTES.length) return {label:null, byCat:{}};
  const header=NOTES[0];
  // latest column with any content at or before today; else latest dated column with content
  let best=-1;
  for(let c=1;c<header.length;c++){
    const has=NOTES.slice(1).some(r=>(r[c]||"").trim());
    if(has) best=c;
  }
  if(best<0) return {label:null, byCat:{}};
  const byCat={}; let cat="";
  NOTES.slice(1).forEach(r=>{
    if((r[0]||"").trim()) cat=(r[0]||"").trim();
    const v=(r[best]||"").trim();
    if(v) (byCat[cat]=byCat[cat]||[]).push(v);
  });
  return {label:header[best], byCat};
}
function renderWeek(){
  const {label,byCat}=currentWeekColumn();
  const walks=store.get(WALK_KEY,[]);
  walks.forEach(n=>{ (byCat[n.cat]=byCat[n.cat]||[]).push("● "+(n.label?n.label+": ":"")+n.text); });
  const cats=Object.keys(byCat);
  $("#view-week").innerHTML=`
    <div class="row1"><div><h2 class="page">${t("week_title")} <span style="color:var(--mut2);font-size:16px" class="num">${label?("· "+esc(label)):""}</span></h2>
      <div class="sub">${t("week_sub")}</div></div></div>
    <div class="lanes">${cats.map(c=>`
      <div class="lane"><h4>${esc(c)} <span class="n num">${byCat[c].length}</span></h4>
        ${byCat[c].map(v=>`<div class="job">${linkSerials(esc(v))}</div>`).join("")}
      </div>`).join("")||`<div style="color:var(--mut)">—</div>`}
    </div>`;
}
function linkSerials(html){
  return html.replace(/\b(\d{4,8})\b/g,(m,d)=> PIANOS.has(skey(d))
    ? `<a class="serial-link" target="_blank" rel="noreferrer" href="${CONFIG.PIANOLOG_URL}?q=${d}">${d}</a>` : m);
}

const PHASES=[
  {id:"INTAKE",   en:"New Arrival",     es:"Recién llegado",    code:"",     hb:["Storing Cabinetry"]},
  {id:"ASSESS",   en:"Assessment",      es:"Evaluación",        code:"",     hb:["Tear-down Sheet (§16)"]},
  {id:"TEARDOWN", en:"Teardown",        es:"Desarmado",         code:"",     hb:["Upright Teardown: Cleaning & Prep","Grand Teardown: Cleaning & Prep","Removing Tuning Pins","Storing Cabinetry (§14)","Tear-down Sheet (§16)"]},
  {id:"PRSB",     en:"PRSB",            es:"PRSB",              code:"Perimeter · Ribs · Soundboard · Bridge", hb:["Find Proper Downbearing: Targets","How to Chisel a Bridge","Restringing (§12)"]},
  {id:"CAP",      en:"CAP",             es:"CAP",               code:"Cleaning · Action Prep", hb:["Cleaning and Prep","Action Prep","Reshape Hammers","Hammer Prep & Hanging","Keys (§13)"]},
  {id:"REFINISH", en:"Refinishing",     es:"Acabado",           code:"L1 · L2 · L3", hb:["Buffing Basics","Buffing Casters","Hardware (§3)"]},
  {id:"ASSEMBLY", en:"Final Assembly",  es:"Ensamblaje final",  code:"",     hb:["Storing Cabinetry (§14)","Hardware (§3)"]},
  {id:"DHRT",     en:"DHRT",            es:"DHRT",              code:"Dampers · Hammers · Regulation · Trapwork", hb:["Upright Regulation","Grand Piano Regulation Theory","Key Leveling","Tricks for Let Off Regulation","Aligning Backchecks","Damper Lift","Damper Spoon Regulation","Spring Strength, Drop, and Dip"]},
  {id:"TUNING",   en:"Tuning",          es:"Afinación",         code:"",     hb:[]},
  {id:"QC",       en:"QC",              es:"QC",                code:"",     hb:["QC Checklist (doc)"]},
  {id:"READY",    en:"Admin Exit Prep", es:"Preparación de salida", code:"", hb:[]},
  {id:"DELIVERED",en:"Delivered",       es:"Entregado",         code:"",     hb:[]},
  {id:"FORSALE",  en:"For Sale",        es:"En venta",          code:"",     hb:[]},
];
const phaseName=p=>LANG==="es"?p.es:p.en;
function inferPhase(rec){
  const ov=store.get(PH_KEY,{})[skey(rec.serial)];
  if(ov) return ov;
  const qc=store.get(QC_KEY,{})[skey(rec.serial)];
  if(qc && !qc.ready) return "QC";
  if(qc && qc.ready) return "READY";
  // 1) sequence text from ACTIVE roster lanes only (exact serial-token match)
  let txt="";
  const mySerial=skey(rec.serial);
  const firsts=new Set(ROSTER.map(n=>n.split(/\s+/)[0].toLowerCase()));
  seqRows().forEach(r=>{
    if(!firsts.has((r[1]||"").trim().split(/\s+/)[0].toLowerCase())) return;
    r.slice(2).forEach(j=>{ if(j && (j.match(/\d{4,8}/g)||[]).includes(mySerial)) txt+=" "+j; });
  });
  const s=txt.toLowerCase();
  if(s.trim()){
    if(/dhrt|regulat|voic/.test(s)) return "DHRT";
    if(/restring|prsb|soundboard|bridge|pinblock|downbearing/.test(s)) return "PRSB";
    if(/\bcap\b|action prep|clean/.test(s)) return "CAP";
    if(/teardown|tear down/.test(s)) return "TEARDOWN";
    if(/tun(e|ing)/.test(s)) return "TUNING";
    if(/rebuild|restoration|refurb/.test(s)) return "TEARDOWN";
  }
  // 2) refinishing queue
  if(rec.refinishPri) return "REFINISH";
  // 3) the piano's latest report snippet
  const p=(rec.snip||"").toLowerCase();
  if(/refinish|lacquer|stain|sanding|sprayed|filler|buff/.test(p)) return "REFINISH";
  if(/assembl/.test(p)) return "ASSEMBLY";
  if(/regulat|voic|damper|dhrt|trapwork/.test(p)) return "DHRT";
  if(/restring|soundboard|bridge|pinblock|plate|chip/.test(p)) return "PRSB";
  if(/action|hammer|felts|keytop|keys/.test(p)) return "CAP";
  if(/teardown|tear down/.test(p)) return "TEARDOWN";
  if(/tun(ed|e|ing)/.test(p)) return "TUNING";
  return "ASSESS";
}
function renderPipeline(){
  const cols={}; PHASES.forEach(p=>cols[p.id]=[]);
  const recentCut=new Date(); recentCut.setDate(recentCut.getDate()-120);
  [...PIANOS.values()].forEach(rec=>{
    const inPlay = rec.refinishPri || rec.inSeq ||
      (rec.lastDate && rec.lastDate >= iso(recentCut)) ||
      store.get(QC_KEY,{})[skey(rec.serial)];
    if(!inPlay) return;
    const ph=inferPhase(rec);
    (cols[ph]=cols[ph]||[]).push(rec);
  });
  $("#view-pipeline").innerHTML=`
    <div class="row1"><div><h2 class="page">${t("pipe_title")}</h2><div class="sub">${t("pipe_sub")}</div></div>
      <a class="btn2" style="text-decoration:none" target="_blank" rel="noreferrer" href="${CONFIG.HANDBOOK_APP}">${t("handbook")} ↗</a></div>
    <div class="pipe">${PHASES.map(p=>`
      <div class="pcol"><h4>${phaseName(p)} <span style="display:flex;gap:5px;align-items:center"><span class="n num">${cols[p.id].length}</span>${p.hb.length?`<button class="hb" data-p="${p.id}">?</button>`:""}</span></h4>
        <div class="code">${p.code}</div>
        ${cols[p.id].map(rec=>`
          <div class="pcard2"><a class="serial-link" target="_blank" rel="noreferrer" href="${CONFIG.PIANOLOG_URL}?q=${skey(rec.serial)}">${esc(rec.label)}</a>

    const crYes=crCol>=0&&/^yes$/i.test(String(r[crCol]||"").trim());   // explicit opt-in from the Store Map
    const key=skey(serial)||serial.toLowerCase();
    const lines=owner.split("\n").map(s=>s.trim()).filter(Boolean);
    const ownerName=(lines.find(l=>!l.includes("@")&&!/\d{3}/.test(l))||lines[0]||"").slice(0,60);
    const ownerEmail=(lines.find(l=>l.includes("@"))||"").split(/\s/).find(w=>w.includes("@"))||"";
    const phases={};
    Object.entries(PHASE_COLS).forEach(([k,i])=>{ const v=(r[i]||"").trim(); if(v) phases[k]=v; });
    const emailUpd=(r[59]||"").trim();
    const dm=/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(emailUpd);
    const sheetSent=dm?`${dm[3].length===2?"20"+dm[3]:dm[3]}-${String(dm[1]).padStart(2,"0")}-${String(dm[2]).padStart(2,"0")}`:null;
    const lastSent=(log[key]&&log[key].sentAt)||sheetSent;
    const rec=PIANOS.get(key);
    const lastMention=SERIAL_DATES.get(key)||null;
    const activity=!!(lastMention&&lastMention>=iso(recentCut));
    const include=crYes||(key in flags ? flags[key] : activity);
    out.push({key, serial, owner, ownerName, ownerEmail,

      make:(r[5]||"").trim(), model:(r[6]||"").trim(), status:(r[18]||"").trim(),
      photosFolder:(r[37]||"").trim(), phases, emailUpd, lastSent, include, activity});

// Extract ONLY the clauses that belong to this piano's serial. Reports pack
// several pianos into one cell ("Marxophone: Done! M&W 75866: wind chest...
// Hallet Davis 39363: hammers"); we key off each "Brand ... serial:" label
// and keep the text between this piano's label and the next piano's label —
// so a neighboring project can never bleed into this client's update.
const LABEL_RE = /([A-Z][A-Za-z.&'’()\/\- ]{1,30}?\s(\d{3,8}))\s*[:\-–]/g;
function pianoClauses(text, serial){
  const sk = skey(serial); const out = [];
  const marks = []; let m; LABEL_RE.lastIndex = 0;
  while((m = LABEL_RE.exec(text))){ marks.push({start: LABEL_RE.lastIndex, at: m.index, serial: skey(m[2])}); }
  for(let i=0;i<marks.length;i++){
    if(marks[i].serial !== sk) continue;
    const stop = (i+1<marks.length) ? marks[i+1].at : text.length;
    let clause = text.slice(marks[i].start, stop).trim().replace(/\s+/g," ");
    if(clause) out.push(clause);
  }
  // Fallback: serial with no clear label — take the sentence around it.
  if(!out.length && (text.match(/\d{4,8}/g)||[]).includes(sk)){
    const i = text.search(new RegExp(sk));
    if(i>=0) out.push(text.slice(i, i+180).replace(/^\d+\D*/,"").split(/(?<=[.!])\s/)[0].trim());
  }
  return out;
}
function cliEvidence(c){
  const since=c.lastSent||iso(new Date(Date.now()-60*86400e3));
  return REPORTS.entries
    .filter(e=>e.date&&e.date>since&&(e.text.match(/\d{4,8}/g)||[]).includes(skey(c.serial)))
    .sort((a,b)=>a.date.localeCompare(b.date))
    .flatMap(e=>pianoClauses(e.text, c.serial).map(text=>({date:fmtShort(e.date), tech:e.tech, text})))
    .filter(x=>x.text.length>3)
    .slice(-14);
}
// Client-friendly phase names for the "completed so far" line.
const PHASE_LABELS={
  "KEYWORK":["keywork","el trabajo de teclado"],
  "CAP":["cleaning and action prep","la limpieza y preparación del mecanismo"],
  "SOUNDBOARD / BRIDGE":["soundboard and bridge work","la tabla armónica y los puentes"],
  "RESTRINGING":["restringing","el encordado"],
  "DHRT":["dampers, hammers and regulation","apagadores, martillos y regulación"],
  "REFINISHING":["refinishing","el acabado"],
  "PLATING":["hardware plating","el cromado de herrajes"],
  "QC":["the final quality check","la revisión final de calidad"],
};
// Drop sentences that aren't really about the client's piano or read like
// internal shop chatter, then convert first-person tech phrasing to "we".
const ASIDE_RE=/^(all other|other showroom|showroom items|still a work in progress|in progress|still in progress|can'?t wait|i('?ll| will) (be taking|take)|taking \w+ off|the \w+ qc is|update:?)\b/i;
function toSentences(s){ return s.split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean); }
function cleanClause(s){
  const kept=toSentences(s)
    .filter(sen=>!ASIDE_RE.test(sen))
    .map(sen=>sen
      .replace(/\bI['’]?m\b/gi,"we're").replace(/\bI am\b/gi,"we are")
      .replace(/\bI['’]ll\b/gi,"we'll").replace(/\bI will\b/gi,"we will")
      .replace(/\bI['’]ve\b/gi,"we've").replace(/\bI have\b/gi,"we have")
      .replace(/\bI\b/g,"we").replace(/\bmy\b/gi,"our")
      .replace(/give me (another|a) week[^.!]*/gi,"")
      .replace(/if all(owed)?[^.!]*/gi,"")
      .replace(/\bupper stack\b/gi,"upper stack").replace(/\bup$/,"upright"))
    .map(sen=>sen.replace(/\s+/g," ").replace(/\s+([.,!?])/g,"$1").trim())
    .filter(sen=>sen.length>6)
    // require real prose: at least 3 word-ish tokens once %/parentheticals are
    // stripped — drops status fragments like "0% (without color)".
    .filter(sen=>sen.replace(/\d+\s*%|\([^)]*\)/g,"").split(/\s+/).filter(w=>/[a-z]{3,}/i.test(w)).length>=3)
    .map(sen=>sen.charAt(0).toUpperCase()+sen.slice(1));
  return kept.join(" ");
}
function localTemplate(c, evid){

    .map(k=>(PHASE_LABELS[k]||[k.toLowerCase(),k.toLowerCase()])[es?1:0]);
  // The two most recent substantive clauses about THIS piano, cleaned.
  const clauses=[...new Set(evid.map(e=>cleanClause(e.text)).filter(x=>x.length>6))];
  // The most recent substantive clause is the current status; add the one
  // before it only if the latest is very short (keeps it current, not contradictory).
  const latest = clauses.length
    ? (clauses[clauses.length-1].length<48 ? clauses.slice(-2) : clauses.slice(-1))
    : [];
  const doneLine = done.length
    ? (es?`Hasta ahora hemos completado ${listEs(done)}.`:`So far we've completed ${listEn(done)}.`)
    : "";
  const workPara = latest.length
    ? (es?`Nuestro equipo ha estado enfocado en su instrumento. ${latest.join(" ")}`

? `Hola ${first},

Quería contarle cómo va su ${pianoName} — está avanzando muy bien con nosotros.

${workPara}
${doneLine?"\n"+doneLine+"\n":""}
Le seguiré informando a medida que pase a la siguiente fase. Si tiene cualquier pregunta, solo responda a este correo — con gusto hablo de pianos cuando quiera.

Un cordial saludo,
Brigham Larson
Brigham Larson Pianos`
: `Hi ${first},

I wanted to share where things stand with your ${pianoName} — it's coming along beautifully here in our shop.

${workPara}
${doneLine?"\n"+doneLine+"\n":""}
I'll keep you posted as it moves into the next phase. If you have any questions at all, just reply to this email — I'm always happy to talk pianos.

Warmly,
Brigham Larson
Brigham Larson Pianos`;
  return {subject: es?`Novedades de su ${pianoName}`:`An update on your ${pianoName}`, body};
}
function listEn(a){ return a.length<2?a[0]||"":a.length===2?a.join(" and "):a.slice(0,-1).join(", ")+", and "+a[a.length-1]; }
function listEs(a){ return a.length<2?a[0]||"":a.length===2?a.join(" y "):a.slice(0,-1).join(", ")+" y "+a[a.length-1]; }
